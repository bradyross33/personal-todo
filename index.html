  block.querySelectorAll('.intake-item').forEach(row=>{
    row.addEventListener('click',e=>{
      if(e.target.classList.contains('intake-item-del'))return;
      const item=app.intake.items.find(i=>i.id===row.dataset.id);
      if(item){item._open=!item._open;save(app);renderIntake();}
    });
  });
  block.querySelectorAll('.intake-note-inp').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const item=app.intake.items.find(i=>i.id===inp.dataset.id);
      if(item){item.note=inp.value;save(app);}
    });
  });
  block.querySelectorAll('.intake-url-inp').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const item=app.intake.items.find(i=>i.id===inp.dataset.id);
      if(item){item.url=inp.value.trim();save(app);renderIntake();}
    });
  });
  block.querySelectorAll('.intake-item-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      app.intake.items=app.intake.items.filter(i=>i.id!==btn.dataset.id);
      save(app);renderIntake();
    });
  });

  function addIntakeItem(){
    const inp=block.querySelector('#intake-new');if(!inp||!inp.value.trim())return;
    const now=new Date();
    const added=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
    app.intake.items.push({id:'intake-'+Date.now(),name:inp.value.trim(),note:'',added,_open:false});
    inp.value='';save(app);renderIntake();
  }
  block.querySelector('#intake-add-btn').addEventListener('click',addIntakeItem);
  block.querySelector('#intake-new').addEventListener('keydown',e=>{if(e.key==='Enter')addIntakeItem();});


  // Current Tasks
  if(!app.currentTasks)app.currentTasks=[];
  const cts=app.currentTasks;
  const ctOpen=app.currentTasksOpen!==false;
  const ctBlock=document.createElement('div');ctBlock.className='block';ctBlock.style.marginTop='16px';
  const ctHtml=cts.length===0
    ?'<div class="empty-note" style="padding:14px 16px">No flagged tasks yet</div>'
    :cts.map((ct,i)=>'<div style="border-top:0.5px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 16px">'
      +'<span class="ct-rank" data-ctid="'+ct.id+'" style="width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer">'+(i+1)+'</span>'
      +'<input type="checkbox" class="ct-chk" data-ctid="'+ct.id+'" '+(ct.done?'checked ':'')+' style="width:17px;height:17px;accent-color:var(--blue);cursor:pointer;flex-shrink:0" />'
      +'<div style="flex:1;min-width:0"><div style="font-size:14px;color:var(--text);'+(ct.done?'text-decoration:line-through;color:var(--text3)':'')+'">'+(ct.text||ct.name||'')+'</div><div style="font-size:11px;color:var(--text3)">'+(ct.source||'')+'</div></div>'
      +'<button class="ct-unflag" data-ctid="'+ct.id+'" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--blue);padding:4px">&#128681;</button>'
      +'</div>').join('');
  ctBlock.innerHTML='<div class="block-header" id="ct-hdr"><span class="block-title">&#128681; Current tasks <span class="block-meta">'+cts.length+'</span></span><span class="chevron '+(ctOpen?'open':'')+'">&#8964;</span></div><div class="block-body '+(ctOpen?'open':'')+'">'+ctHtml+'</div>';
  container.appendChild(ctBlock);
  ctBlock.querySelector('#ct-hdr').addEventListener('click',()=>{app.currentTasksOpen=!ctOpen;save(app);renderIntake();});
  ctBlock.querySelectorAll('.ct-chk').forEach(chk=>{
    chk.addEventListener('change',()=>{
      const ct=(app.currentTasks||[]).find(c=>c.id===chk.dataset.ctid);if(!ct)return;
      ct.done=chk.checked;
      if(ct.sourceType==='nextStep'){const p=findProject(ct.sourceProjectId);if(p&&p.nextSteps&&p.nextSteps[ct.sourceNsIdx])p.nextSteps[ct.sourceNsIdx].done=chk.checked;}
      else if(ct.sourceType==='ongoing'){const t=(app.ongoing[ct.sourceKey]||[]).find(t=>t.id===ct.sourceTaskId);if(t)t._done=chk.checked;}
      if(chk.checked){setTimeout(()=>{app.currentTasks=app.currentTasks.filter(c=>c.id!==chk.dataset.ctid);save(app);renderIntake();},600);}
      else{save(app);renderIntake();}
    });
  });
  ctBlock.querySelectorAll('.ct-unflag').forEach(btn=>{btn.addEventListener('click',()=>{app.currentTasks=(app.currentTasks||[]).filter(c=>c.id!==btn.dataset.ctid);save(app);renderIntake();});});
  ctBlock.querySelectorAll('.ct-rank').forEach(span=>{
    span.addEventListener('click',()=>{
      const idx=(app.currentTasks||[]).findIndex(c=>c.id===span.dataset.ctid);if(idx<0)return;
      const nr=parseInt(prompt('Move to position (1-'+app.currentTasks.length+'):',idx+1))-1;
      if(isNaN(nr)||nr<0||nr>=app.currentTasks.length)return;
      const [item]=app.currentTasks.splice(idx,1);app.currentTasks.splice(nr,0,item);
      save(app);renderIntake();
    });
  });
}

// ── DAY AT A GLANCE (manual) ─────────────────────────────────
let calWeekStart=getWeekStart(new Date());
const _todayDow=new Date().getDay();
let calDayOffset=_todayDow===0?6:_todayDow-1;

function getWeekStart(d){
  const date=new Date(d);date.setHours(0,0,0,0);
  const day=date.getDay();const diff=day===0?-6:1-day;
  date.setDate(date.getDate()+diff);return date;
}
function getDayDate(weekStart,offset){
  const d=new Date(weekStart);d.setDate(d.getDate()+offset);return d;
}
function fmtDayLabel(date){
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((date-today)/86400000);
  const base=date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  if(diff===0)return{main:base,sub:'Today'};
  if(diff===1)return{main:base,sub:'Tomorrow'};
  if(diff===-1)return{main:base,sub:'Yesterday'};
  return{main:base,sub:''};
}
function fmtTime(t){
  if(!t)return'';
  const parts=t.split(':').map(Number);
  const h=parts[0]||0,m=parts[1]||0;
  const ampm=h>=12?'PM':'AM';
  const hr=h%12||12;
  return hr+':'+(m<10?'0':'')+m+' '+ampm;
}

let _dayRenderToken=0;
function findManualEv(dateStr,id){
  return (app.manualEvents[dateStr]||[]).find(e=>e.id===id);
}
async function renderDay(){
  const myToken=++_dayRenderToken;
  const container=document.getElementById('tab-day');
  container.innerHTML='';
  if(myToken!==_dayRenderToken)return;

  // Week strip
  const today=new Date();today.setHours(0,0,0,0);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const stripDiv=document.createElement('div');stripDiv.className='day-week-strip';
  for(let i=0;i<7;i++){
    const d=getDayDate(calWeekStart,i);
    const isToday=d.getTime()===today.getTime();
    const isActive=i===calDayOffset;
    const pill=document.createElement('button');
    pill.className='day-week-pill'+(isActive?' active':'')+(isToday?' today-pill':'');
    pill.innerHTML='<div>'+days[i]+'</div><div style="font-size:11px">'+d.getDate()+'</div>';
    pill.addEventListener('click',()=>{calDayOffset=i;renderDay();});
    stripDiv.appendChild(pill);
  }
  container.appendChild(stripDiv);

  // Daily to-do list
  const selectedDayDate=getDayDate(calWeekStart,calDayOffset);
  const dk=selectedDayDate.toISOString().split('T')[0];
  if(!app.dailyTodos[dk]) app.dailyTodos[dk]={items:[],_open:true};
  const dtd=app.dailyTodos[dk];
  const todoBlock=document.createElement('div');todoBlock.className='block';todoBlock.style.marginBottom='12px';
  const todoOpen=dtd._open!==false;
  const todoItems=[...dtd.items];
  todoBlock.innerHTML='<div class="block-header" id="dtd-hdr"><span class="block-title">&#9989; Today\'s to-dos <span class="block-meta">'+todoItems.filter(t=>!t.done).length+' remaining</span></span><span class="chevron '+(todoOpen?'open':'')+'">&#8964;</span></div>'
    +'<div class="block-body '+(todoOpen?'open':'')+'" id="dtd-body">'
    +(todoItems.length===0?'<div class="empty-note" style="padding:12px 16px">No to-dos yet — add one below</div>':'')
    +todoItems.map(function(t,i){
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:0.5px solid var(--border)">'

if(nextBtn)nextBtn.addEventListener('click',()=>{if(offset<0){offset++;render();}});

async function init(){
  try{
    // Try Gist first, fall back to localStorage
    updateSyncStatus('syncing');
    try{
      app=await loadFromGist();
      patchApp(); // ensure IDs etc are set
      saveLocal(app); // cache locally
      updateSyncStatus('synced');
    }catch(e){
      console.warn('Gist load failed, using local:',e);
      app=loadLocal()||JSON.parse(JSON.stringify(DEFAULT_DATA));
      patchApp();
      updateSyncStatus('error');
    }

    // Patch missing fields safely
    if(!app.ongoing) app.ongoing={};
    if(!app.ongoing.daily||app.ongoing.daily.length===0) app.ongoing.daily=JSON.parse(JSON.stringify(DEFAULT_DATA.ongoing.daily));
    if(!app.ongoing.weekly) app.ongoing.weekly=[];
    if(!app.ongoing.monthly) app.ongoing.monthly=[];
    if(!app.ongoing.other) app.ongoing.other=[];
    if(!app.mary) app.mary={items:[]};
  if(!app.support) app.support={domainReflections:[
    {id:'dr-marriage',name:'Marriage',status:'',nextStep:'',url:''},
    {id:'dr-parenting',name:'Parenting',status:'',nextStep:'',url:''},
    {id:'dr-social',name:'Social',status:'',nextStep:'',url:''}
  ],developmentAreas:[
    {id:'da-coaching',name:'Coaching',focus:'',nextStep:'',url:''},
    {id:'da-training',name:'Training',focus:'',nextStep:'',url:''},
    {id:'da-writing',name:'Writing',focus:'',nextStep:'',url:''}
  ],claudeHelpers:[
    {id:'ch-counselor',name:'Counselor',url:''},
    {id:'ch-coach',name:'Coach',url:''},
    {id:'ch-assistant',name:'Assistant',url:''}
  ]};
    if(!app.intake) app.intake={items:[]};
    if(!app.reminders) app.reminders=[];
    if(!app.dailyChecks) app.dailyChecks={};
    if(!app.domains) app.domains=JSON.parse(JSON.stringify(DEFAULT_DATA.domains));
    if(!app.events) app.events={months:[]};
    if(!app.logs) app.logs={};

    // thisWeek — ensure all fields present
    if(!app.thisWeek) app.thisWeek={tasks:[],generatedFor:'',_open:false,checks:{},weekOf:''};
  if(!app.dailyTodos) app.dailyTodos={};
  // Migrate extraUrls to labeled format
  ['weekly','monthly','other'].forEach(k=>{(app.ongoing[k]||[]).forEach(t=>{
    if(t.extraUrls) t.extraUrls=t.extraUrls.map(u=>typeof u==='string'?{label:'Link',url:u}:u);
  });});
    if(!app.thisWeek.checks) app.thisWeek.checks={};
    if(!app.thisWeek.weekOf) app.thisWeek.weekOf='';

    // Patch project fields
    allProjects().forEach(p=>{
      if(p.weeklyPlan===undefined) p.weeklyPlan='';
      if(p.weeklyPlanName===undefined) p.weeklyPlanName='';
      if(p.remindDate===undefined) p.remindDate='';
      if(p.onTrack===undefined) p.onTrack=undefined;
      if(p.hasWeeklyPlan===undefined) p.hasWeeklyPlan=p.weeklyPlan?true:false;
      if(p.planDeadline===undefined) p.planDeadline='';
      if(p.dueDate===undefined) p.dueDate='';
      if(!p.nextSteps) p.nextSteps=p.nextStep?[{id:'ns0',text:p.nextStep,done:false}]:[];
      if(!p.waitingItems) p.waitingItems=[];
      if(!p.links) p.links=p.threadUrl?[{id:'lnk0',label:'Thread',url:p.threadUrl}]:[];
      if(!p.weeklyTasks) p.weeklyTasks={};
      if(p.nextSteps===undefined) p.nextSteps=p.nextStep?[p.nextStep]:[];
      if(p.waitingItems===undefined) p.waitingItems=[];
      if(p.links===undefined) p.links=p.threadUrl?[{label:'Thread',url:p.threadUrl}]:[];
      if(p.dueDate===undefined) p.dueDate='';
      if(p.weeklyTasks===undefined) p.weeklyTasks={};
      if(p.extraUrls) p.extraUrls=p.extraUrls.map(u=>typeof u==='string'?{label:'Link',url:u}:u);
    });
    // Patch events — fix missing fields, split merged date/name, sort by day
    (app.events.months||[]).forEach(m=>{
      (m.events||[]).forEach(ev=>{
        if(ev.notes===undefined) ev.notes='';
        if(ev.location===undefined) ev.location='';
        if(ev.threadUrl===undefined) ev.threadUrl='';
        if(ev.prepItems===undefined) ev.prepItems=[];
        // Fix events where date was merged into name (e.g. "21st - COKHR")
        if(!ev.date&&ev.name){
          const match=ev.name.match(/^(\d+(?:st|nd|rd|th)?(?:[-–]+\d+(?:st|nd|rd|th)?)?)\s*[-–—:]\s*(.+)$/i);
          if(match){ev.date=match[1].trim();ev.name=match[2].trim();}
        }
        // Store numeric day for sorting
        if(ev._dayNum===undefined) ev._dayNum=parseInt(ev.date)||0;
      });
      // Sort by day number
      m.events.sort((a,b)=>(a._dayNum||parseInt(a.date)||0)-(b._dayNum||parseInt(b.date)||0));
    });
    // Patch weekly tasks
    const devAreas=app.ongoing.weekly.find(t=>t.id==='w5');
    if(devAreas&&!devAreas.subitems) devAreas.subitems=[{id:'w5-1',name:'Coaching',checked:false,threadUrl:''},{id:'w5-2',name:'Training',checked:false,threadUrl:''},{id:'w5-3',name:'Writing',checked:false,threadUrl:''}];
    const domRef=app.ongoing.weekly.find(t=>t.id==='w6');
    if(domRef&&!domRef.subitems) domRef.subitems=[{id:'w6-1',name:'Marriage',checked:false,threadUrl:''},{id:'w6-2',name:'Parenting',checked:false,threadUrl:''},{id:'w6-3',name:'Social',checked:false,threadUrl:''}];
    app.ongoing.weekly.forEach(t=>{if(t.threadUrl===undefined)t.threadUrl='';});
    app.ongoing.monthly.forEach(t=>{if(t.threadUrl===undefined)t.threadUrl='';});
    app.ongoing.other.forEach(t=>{if(t.threadUrl===undefined)t.threadUrl='';});
    allFutureProjects().forEach(p=>{
      if(p.targetWindow===undefined) p.targetWindow='';
    });
    // Ensure Personal domain exists
    if(!app.domains.find(d=>d.id==='ross-family')){
    app.domains.push({id:'ross-family',name:'Ross Family Enterprises',categories:[
      {id:'ross-current',name:'Current projects',projects:[]},
      {id:'ross-future',name:'Future ideas',projects:[]}
    ]});
  }
  if(!app.domains.find(d=>d.id==='personal')){
      app.domains.push({id:'personal',name:'Personal',categories:[
        {id:'personal-current',name:'Current projects',projects:[]},
        {id:'personal-future',name:'Future ideas',projects:[]}
      ]});
    }
    // Ensure Personal is always last
    const personalIdx=app.domains.findIndex(d=>d.id==='personal');
    if(personalIdx!==-1 && personalIdx!==app.domains.length-1){
      const [personal]=app.domains.splice(personalIdx,1);
      app.domains.push(personal);
    }

    app.testDate='';
    ensureRollingMonths();
    render();

  } catch(err) {
    document.body.innerHTML='<div style="padding:2rem;font-family:sans-serif;color:#a32d2d;background:#fcebeb;border-radius:12px;margin:1rem">'
      +'<strong>Startup error:</strong> '+err.message+'<br><br>'
      +'<button onclick="localStorage.clear();location.reload()" style="padding:8px 16px;cursor:pointer;border:1px solid #a32d2d;border-radius:8px;background:none;color:#a32d2d">Clear data &amp; reload</button>'
      +'</div>';
    console.error(err);
  }
}

  if (e.target.closest('.ns-add-btn')) {
    const btn = e.target.closest('.ns-add-btn');
    const body = btn.closest('.proj-body');
    if (!body) return;
    const row = btn.closest('.proj-row') || btn.closest('[data-p]');
    // Find project id from the save button in same body
    const saveBtn = body.querySelector('.proj-save');
    if (!saveBtn) return;
    const pid = saveBtn.dataset.p;
    const p = findProject(pid); if (!p) return;
    const inp = body.querySelector('.ns-new-inp');
    if (!inp || !inp.value.trim()) return;
    if (!p.nextSteps) p.nextSteps = [];
    p.nextSteps.push({id:'ns-'+Date.now(), text:inp.value.trim(), done:false});
    inp.value = '';
    save(app); renderProjects();
    return;
  }
  // ── ns-del ──
  if (e.target.closest('.ns-del')) {
    const btn = e.target.closest('.ns-del');
    const body = btn.closest('.proj-body');
    const saveBtn = body && body.querySelector('.proj-save');
    if (!saveBtn) return;
    const p = findProject(saveBtn.dataset.p); if (!p) return;
    const si = parseInt(btn.dataset.si);
    if (p.nextSteps) p.nextSteps.splice(si, 1);
    save(app); renderProjects();
    return;
  }
  // ── wi-add-btn ──
  if (e.target.closest('.wi-add-btn')) {
    const btn = e.target.closest('.wi-add-btn');
    const body = btn.closest('.proj-body');
    const saveBtn = body && body.querySelector('.proj-save');
    if (!saveBtn) return;
    const p = findProject(saveBtn.dataset.p); if (!p) return;
    const inp = body.querySelector('.wi-new-inp');
    if (!inp || !inp.value.trim()) return;
    if (!p.waitingItems) p.waitingItems = [];
    p.waitingItems.push({id:'wi-'+Date.now(), text:inp.value.trim()});
    inp.value = '';
    save(app); renderProjects();
    return;
  }
  // ── wi-del ──
  if (e.target.closest('.wi-del')) {
    const btn = e.target.closest('.wi-del');
    const body = btn.closest('.proj-body');
    const saveBtn = body && body.querySelector('.proj-save');
    if (!saveBtn) return;
    const p = findProject(saveBtn.dataset.p); if (!p) return;
    const wi = parseInt(btn.dataset.wi);
    if (p.waitingItems) p.waitingItems.splice(wi, 1);
    save(app); renderProjects();
    return;
  }
  // ── lnk-add-btn ──
  if (e.target.closest('.lnk-add-btn')) {
    const btn = e.target.closest('.lnk-add-btn');
    const body = btn.closest('.proj-body');
    const saveBtn = body && body.querySelector('.proj-save');
    if (!saveBtn) return;
    const p = findProject(saveBtn.dataset.p); if (!p) return;
    const label = body.querySelector('.lnk-new-label');
    const url = body.querySelector('.lnk-new-url');
    if (!url || !url.value.trim()) return;
    if (!p.links) p.links = [];
    p.links.push({id:'lnk-'+Date.now(), label:label?label.value.trim():'Link', url:url.value.trim()});
    if (label) label.value = '';
    url.value = '';
    save(app); renderProjects();
    return;
  }
  // ── lnk-del ──
  if (e.target.closest('.lnk-del')) {
    const btn = e.target.closest('.lnk-del');
    const body = btn.closest('.proj-body');
    const saveBtn = body && body.querySelector('.proj-save');
    if (!saveBtn) return;
    const p = findProject(saveBtn.dataset.p); if (!p) return;
    const li = parseInt(btn.dataset.li);
    if (p.links) p.links.splice(li, 1);
    save(app); renderProjects();
    return;
  }
  // ── wt-add-btn ──
  if (e.target.closest('.wt-add-btn')) {
    const btn = e.target.closest('.wt-add-btn');
    const p = findProject(btn.dataset.p); if (!p) return;
    const mon = btn.dataset.mon;
    const inp = btn.previousElementSibling;
    if (!inp || !inp.value.trim()) return;
    if (!p.weeklyTasks) p.weeklyTasks = {};
    if (!p.weeklyTasks[mon]) p.weeklyTasks[mon] = [];
    p.weeklyTasks[mon].push({text:inp.value.trim(), done:false});
    inp.value = '';
    save(app); renderProjects();
    return;
  }
  // ── wt-del ──
  if (e.target.closest('.wt-del')) {
    const btn = e.target.closest('.wt-del');
    const p = findProject(btn.dataset.p); if (!p) return;
    if (p.weeklyTasks && p.weeklyTasks[btn.dataset.mon]) p.weeklyTasks[btn.dataset.mon].splice(parseInt(btn.dataset.ti), 1);
    save(app); renderProjects();
    return;
  }
  // ── future-promote ──
  if (e.target.closest('.future-promote')) {
    const btn = e.target.closest('.future-promote');
    const pid = btn.dataset.p;
    // Find the project in future ideas
    let proj = null, fromCat = null;
    app.domains.forEach(d => d.categories.forEach(c => {
      if(c.name.toLowerCase().includes('future')) {
        const p = c.projects.find(p => p.id === pid);
        if(p){ proj = p; fromCat = c; }
      }
    }));
    if(!proj || !fromCat) return;
    // Find current projects category in same domain
    const dom = app.domains.find(d => d.categories.some(c => c.projects.some(p => p.id === pid)));
    if(!dom) return;
    const currentCat = dom.categories.find(c => c.name.toLowerCase().includes('current'));
    if(!currentCat){ alert('No Current Projects category found in this domain.'); return; }
    // Move it
    fromCat.projects = fromCat.projects.filter(p => p.id !== pid);
    proj._open = true; proj._editing = true;
    proj.nextSteps = proj.nextSteps || [];
    proj.waitingItems = proj.waitingItems || [];
    proj.weeklyTasks = proj.weeklyTasks || {};
    currentCat.projects.push(proj);
    save(app); renderProjects();
    return;
  }
  // ── future-delete ──
  if (e.target.closest('.future-delete')) {
    const btn = e.target.closest('.future-delete');
    if(!confirm('Delete this idea? This cannot be undone.')) return;
    const pid = btn.dataset.p;
    app.domains.forEach(d => d.categories.forEach(c => {
      c.projects = c.projects.filter(p => p.id !== pid);
    }));
    save(app); renderProjects();
    return;
  }
  // ── proj-delete ──
  if (e.target.closest('.proj-delete')) {
    const btn = e.target.closest('.proj-delete');
    const pid = btn.dataset.p;
    if (!confirm('Delete this project? This cannot be undone.')) return;
    app.domains.forEach(d => d.categories.forEach(c => {
      c.projects = c.projects.filter(p => p.id !== pid);
    }));
    save(app); renderProjects();
    return;
  }
  // ── proj-cancel ──
  if (e.target.closest('.proj-cancel')) {
    const btn = e.target.closest('.proj-cancel');
    const p = findProject(btn.dataset.p); if (!p) return;
    p._editing = false;
    renderProjects();
    return;
  }
  // ── proj-edit-btn ──
  if (e.target.closest('.proj-edit-btn')) {
    const btn = e.target.closest('.proj-edit-btn');
    const p = findProject(btn.dataset.p); if (!p) return;
    p._editing = true; p._open = true;
    renderProjects();
    return;
  }
});

// Global delegated flag handler — works even after re-renders
document.addEventListener('click', function(e) {
  // ── gist-token-save ──
  if(e.target.closest('#gist-token-save')){
    const btn=e.target.closest('#gist-token-save');
    const inp=document.getElementById('gist-token-inp');
    const token=inp?inp.value.trim():'';
    if(!token){alert('Please enter a token.');return;}
    localStorage.setItem('gist_token',token);
    btn.textContent='Saving…';
    updateSyncStatus('syncing');
    loadFromGist().then(function(gistData){
      if(gistData&&Object.keys(gistData).length>3){
        app=gistData;saveLocal(app);patchApp();render();
        document.getElementById('settings-overlay').style.display='none';
      } else {
        return saveToGist(app);
      }
    }).then(function(){
      updateSyncStatus('synced');
      btn.textContent='Saved ✓';
      setTimeout(function(){btn.textContent='Save';},2000);
    }).catch(function(e){
      updateSyncStatus('error');
      btn.textContent='Error — check token';
      setTimeout(function(){btn.textContent='Save';},3000);
      console.error('Gist error:',e);
    });
    return;
  }
  const btn = e.target.closest('.ns-flag, .task-flag, .ev-prep-flag');
  if (!btn) return;
  e.stopPropagation();
  if (!app || !app.currentTasks) { if(app) app.currentTasks = []; else return; }

  if (btn.classList.contains('ns-flag')) {
    const pid = btn.dataset.p;
    const si = parseInt(btn.dataset.si);
    const existing = app.currentTasks.findIndex(c => c.sourceType==='nextStep' && c.sourceProjectId===pid && c.sourceNsIdx===si);
    const nowFlagged = existing < 0;
    if (existing >= 0) { app.currentTasks.splice(existing, 1); }
    else {
      const p = findProject(pid);
      const dom = app.domains.find(d => d.categories.some(c => c.projects.some(pr => pr.id===pid)));
      app.currentTasks.push({id:'ct-'+Date.now(), text:btn.dataset.text, source:(p?p.name:'Project')+(dom?' · '+dom.name:''), sourceType:'nextStep', sourceProjectId:pid, sourceNsIdx:si, done:false});
    }
    // Immediate visual feedback before re-render
    const row = btn.closest('div');
    if (row) { row.style.background = nowFlagged ? '#fff3cd' : ''; }
    btn.style.color = nowFlagged ? '#dc3545' : '#aaa';
    const textSpan = row && row.querySelector('span');
    if (textSpan) { textSpan.style.fontWeight = nowFlagged ? '700' : ''; textSpan.style.color = nowFlagged ? '#7d5a00' : ''; }
    save(app); renderProjects(); renderIntake();

  } else if (btn.classList.contains('task-flag')) {
    const tid = btn.dataset.t;
    const existing = app.currentTasks.findIndex(c => c.sourceType==='ongoing' && c.sourceTaskId===tid);
    if (existing >= 0) { app.currentTasks.splice(existing, 1); }
    else {
      // Find task across all ongoing sections
      let taskName = '', secLabel = '', secKey = '';
      ['weekly','monthly','other'].forEach(key => {
        const t = (app.ongoing[key]||[]).find(t => t.id===tid);
        if (t) { taskName=t.name; secLabel=key.charAt(0).toUpperCase()+key.slice(1)+' tasks'; secKey=key; }
      });
      if (taskName) app.currentTasks.push({id:'ct-'+Date.now(), text:taskName, source:secLabel, sourceType:'ongoing', sourceKey:secKey, sourceTaskId:tid, done:false});
    }
    save(app); renderOngoing(); renderIntake();

  } else if (btn.classList.contains('ev-prep-flag')) {
    const evid = btn.dataset.evid;
    const monthid = btn.dataset.monthid;
    const pi = parseInt(btn.dataset.pi);
    const existing = app.currentTasks.findIndex(c => c.sourceType==='evPrep' && c.sourceEvId===evid && c.sourcePi===pi);
    if (existing >= 0) { app.currentTasks.splice(existing, 1); }
    else {
      const m = (app.events.months||[]).find(m => m.id===monthid);
      const ev = m && m.events.find(e => e.id===evid);
      const monthLabel = m ? m.label.replace(/\s*\d{4}$/,'') : ''; // "May 2026" -> "May"
      const fullSource = ev ? (monthLabel+(ev.date?' '+ev.date:'')+' · '+ev.name+' · Upcoming Events') : 'Upcoming Events';
      app.currentTasks.push({id:'ct-'+Date.now(), text:btn.dataset.text, source:fullSource, sourceType:'evPrep', sourceEvId:evid, sourcePi:pi, done:false});
    }
    save(app); renderEvents(); renderIntake();
  }
});
