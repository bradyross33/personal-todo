<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brady's to-do list</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f7f6f3; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #6b6a64; --text3: #9b9a94;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --green: #3b6d11; --green-bg: #eaf3de;
    --blue: #185fa5; --blue-bg: #e6f1fb;
    --amber: #854f0b; --amber-bg: #faeeda;
    --red: #a32d2d; --red-bg: #fcebeb;
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.12); --border2: rgba(255,255,255,0.22);
      --green: #c0dd97; --green-bg: #27500a;
      --blue: #b5d4f4; --blue-bg: #0c447c;
      --amber: #fac775; --amber-bg: #633806;
      --red: #f09595; --red-bg: #501313;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
  .container { max-width: 640px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 20px; font-weight: 500; color: var(--text); }
  .settings-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text3); padding: 4px; border-radius: var(--radius); }
  .settings-btn:hover { color: var(--text2); background: var(--bg2); }
  .date-nav { display: flex; align-items: center; gap: 10px; }
  .date-label { font-size: 13px; color: var(--text2); min-width: 90px; text-align: center; cursor: pointer; padding: 5px 8px; border-radius: var(--radius); border: 0.5px solid transparent; user-select: none; }
  .date-label:hover { background: var(--bg2); border-color: var(--border); }
  .nav-btn { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: 16px; color: var(--text2); line-height: 1; }
  .nav-btn:hover { background: var(--bg2); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .reminder-banner { margin-bottom: 12px; }
  .reminder-card { background: var(--bg); border: 0.5px solid var(--border); border-left: 3px solid var(--blue); border-radius: var(--radius-lg); padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .reminder-card.urgent { border-left-color: var(--red); }
  .reminder-card-text { flex: 1; }
  .reminder-card-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .reminder-card-note { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .reminder-dismiss { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text3); padding: 2px; }
  .cal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding-top: 70px; }
  .cal-backdrop { position: fixed; inset: 0; }
  .cal-popup { position: relative; z-index: 101; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 16px; width: 280px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-month-label { font-size: 14px; font-weight: 500; color: var(--text); }
  .cal-nav { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text2); padding: 2px 8px; border-radius: var(--radius); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-dow { font-size: 11px; color: var(--text3); padding: 4px 0; text-transform: uppercase; }
  .cal-day { font-size: 13px; padding: 6px 2px; border-radius: var(--radius); cursor: pointer; color: var(--text2); }
  .cal-day:hover { background: var(--bg2); }
  .cal-day.today { font-weight: 500; color: var(--blue); }
  .cal-day.selected { background: var(--blue); color: #fff !important; }
  .cal-day.future { opacity: 0.28; pointer-events: none; }
  .cal-day.empty { pointer-events: none; }
  .settings-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 60px; padding-right: 1rem; }
  .settings-panel { position: relative; z-index: 201; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); width: 320px; max-height: 80vh; overflow-y: auto; }
  .settings-title { font-size: 15px; font-weight: 500; padding: 14px 16px; border-bottom: 0.5px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: space-between; }
  .settings-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text3); }
  .settings-section { padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
  .settings-section-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .reminder-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
  .reminder-item:last-child { border-bottom: none; }
  .reminder-item-info { flex: 1; }
  .reminder-item-name { font-size: 13px; color: var(--text); }
  .reminder-item-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .reminder-item-del { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text3); padding: 2px 4px; }
  .reminder-item-del:hover { color: var(--red); }
  .add-reminder-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .section-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn { padding: 6px 14px; font-size: 13px; border: 0.5px solid var(--border2); border-radius: 20px; background: var(--bg); color: var(--text2); cursor: pointer; font-family: inherit; }
  .tab-btn:hover { background: var(--bg2); }
  .tab-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .block { border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; background: var(--bg); }
  .block-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
  .block-header:hover { background: var(--bg2); }
  .block-title { font-size: 15px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .block-meta { font-size: 12px; color: var(--text3); font-weight: 400; }
  .chevron { font-size: 14px; color: var(--text3); transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .block-body { border-top: 0.5px solid var(--border); display: none; }
  .block-body.open { display: block; }

  .week-task { padding: 10px 16px; border-bottom: 0.5px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
  .week-task:last-child { border-bottom: none; }
  .week-task-project { font-size: 11px; color: var(--text3); min-width: 100px; padding-top: 2px; flex-shrink: 0; }
  .week-task-text { font-size: 13px; color: var(--text); line-height: 1.5; }
  .week-generate-btn { margin: 12px 16px; padding: 7px 16px; font-size: 13px; border: 0.5px solid var(--blue); border-radius: var(--radius); background: none; cursor: pointer; color: var(--blue); font-family: inherit; }
  .week-generate-btn:hover { background: var(--blue-bg); }
  .week-loading { padding: 14px 16px; font-size: 13px; color: var(--text3); }
  .tw-domain-block { border-top: 0.5px solid var(--border); }
  .tw-domain-hdr { display: flex; align-items: center; gap: 8px; padding: 9px 16px; cursor: pointer; background: var(--blue-bg); user-select: none; }
  .tw-domain-hdr:hover { opacity: 0.85; }
  .tw-domain-name { font-size: 12px; font-weight: 600; color: var(--blue); flex: 1; }
  .tw-domain-count { font-size: 11px; color: var(--blue); opacity: 0.7; }
  .tw-domain-body { display: none; }
  .tw-domain-body.open { display: block; }
  .cat-hdr-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; cursor: pointer; user-select: none; background: var(--bg2); }
  .cat-hdr-row:hover { background: var(--bg3); }
  .cat-title { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
  .cat-chevron { font-size: 11px; color: var(--text3); transition: transform 0.2s; display: inline-block; }
  .cat-chevron.open { transform: rotate(90deg); }
  .cat-body { display: none; }
  .cat-body.open { display: block; }
  .proj-row { border-top: 0.5px solid var(--border); }
  .proj-hdr { display: flex; align-items: center; padding: 11px 16px; gap: 8px; }
  .proj-hdr:hover { background: var(--bg2); }
  .proj-name-row { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; flex-wrap: wrap; }
  .proj-name { font-size: 14px; color: var(--text); }
  .window-badge { font-size: 11px; color: var(--text3); background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 1px 7px; white-space: nowrap; flex-shrink: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .dot.empty { background: var(--border2); }
  .dot.red { background: var(--red); }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; color: var(--text3); border-radius: var(--radius); display: flex; align-items: center; flex-shrink: 0; font-size: 16px; line-height: 1; }
  .icon-btn:hover { color: var(--blue); background: var(--blue-bg); }
  .icon-btn.active { color: var(--blue); }
  .proj-body { display: none; padding: 12px 16px 16px; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .proj-body.open { display: block; }
  .edit-btn { background: none; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 5px 12px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: inherit; }
  .edit-btn:hover { background: var(--bg); }
  .task-row { border-top: 0.5px solid var(--border); }
  .task-hdr { display: flex; align-items: center; padding: 11px 16px; gap: 8px; cursor: pointer; }
  .task-hdr:hover { background: var(--bg2); }
  .task-name { font-size: 14px; color: var(--text); flex: 1; }
  .due-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--amber-bg); color: var(--amber); white-space: nowrap; flex-shrink: 0; }
  .due-badge.overdue { background: var(--red-bg); color: var(--red); }
  .task-body { display: none; padding: 12px 16px 16px; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .task-body.open { display: block; }
  .subitem-link-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text3); padding: 3px; border-radius: var(--radius); flex-shrink: 0; }
  .subitem-link-btn:hover { color: var(--blue); background: var(--blue-bg); }
  .subitem-link-btn.active { color: var(--blue); }
  .task-link-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text3); padding: 4px; border-radius: var(--radius); flex-shrink: 0; }
  .task-link-btn:hover { color: var(--blue); background: var(--blue-bg); }
  .task-link-btn.active { color: var(--blue); }
  .flag-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text3); padding: 2px 4px; border-radius: var(--radius); flex-shrink: 0; line-height: 1; }
  .flag-btn:hover { color: var(--red); }
  .flag-btn.flagged { color: var(--red); }
  .event-row { border-top: 0.5px solid var(--border); }
  .event-hdr { display: flex; align-items: center; padding: 11px 16px; gap: 10px; cursor: pointer; }
  .event-hdr:hover { background: var(--bg2); }
  .event-date { font-size: 12px; color: var(--text3); min-width: 52px; flex-shrink: 0; }
  .event-name { font-size: 14px; color: var(--text); flex: 1; }
  .event-body { display: none; padding: 10px 16px 14px; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .event-body.open { display: block; }
  .checklist-item { border-top: 0.5px solid var(--border); display: flex; align-items: center; padding: 11px 16px; gap: 12px; }
  .checklist-item:hover { background: var(--bg2); }
  .checklist-item input[type="checkbox"] { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
  .checklist-item label { font-size: 14px; color: var(--text); cursor: pointer; flex: 1; }
  .checklist-item.checked label { color: var(--text3); text-decoration: line-through; }
  .checklist-progress { padding: 10px 16px; font-size: 12px; color: var(--text3); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.2s; }
  .mary-item { border-top: 0.5px solid var(--border); }
  .mary-hdr { display: flex; align-items: center; padding: 11px 16px; gap: 10px; cursor: pointer; }
  .mary-hdr:hover { background: var(--bg2); }
  .mary-name { font-size: 14px; color: var(--text); flex: 1; }
  .mary-name.done { text-decoration: line-through; color: var(--text3); }
  .mary-check { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
  .mary-body { display: none; padding: 12px 16px 16px; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .mary-body.open { display: block; }
  .mary-add-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 0.5px solid var(--border); }
  .priority-picker { display: flex; gap: 6px; }
  .pri-btn { padding: 4px 12px; font-size: 12px; border-radius: 20px; border: 0.5px solid var(--border2); background: none; cursor: pointer; font-family: inherit; color: var(--text2); }
  .pri-btn.selected-high { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .pri-btn.selected-medium { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .pri-btn.selected-low { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .intake-item { border-top: 0.5px solid var(--border); display: flex; align-items: flex-start; gap: 10px; padding: 11px 16px; }
  .intake-item:hover { background: var(--bg2); }
  .intake-item-text { flex: 1; font-size: 14px; color: var(--text); line-height: 1.5; cursor: pointer; }
  .intake-item-note { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .intake-item-del { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text3); padding: 2px 4px; flex-shrink: 0; }
  .intake-item-del:hover { color: var(--red); }
  .intake-expand { display: none; padding: 10px 16px 14px; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .intake-expand.open { display: block; }
  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day-nav-label { font-size: 15px; font-weight: 500; color: var(--text); }
  .day-nav-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .day-btn { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--text2); }
  .day-btn:hover { background: var(--bg2); }
  .day-week-strip { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .day-week-pill { padding: 5px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); white-space: nowrap; flex-shrink: 0; }
  .day-week-pill:hover { background: var(--bg2); }
  .day-week-pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .day-week-pill.today-pill { border-color: var(--blue); color: var(--blue); }
  .day-week-pill.active.today-pill { background: var(--blue); color: #fff; border-color: var(--blue); }
  .cal-event { border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; overflow: hidden; background: var(--bg); }
  .cal-event-hdr { display: flex; align-items: flex-start; padding: 12px 16px; gap: 12px; cursor: pointer; }
  .cal-event-hdr:hover { background: var(--bg2); }
  .cal-event-time { font-size: 12px; color: var(--text3); min-width: 70px; flex-shrink: 0; padding-top: 2px; }
  .cal-event-info { flex: 1; min-width: 0; }
  .cal-event-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .cal-event-loc { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .cal-event-body { display: none; border-top: 0.5px solid var(--border); background: var(--bg2); }
  .cal-event-body.open { display: block; }
  .cal-empty { padding: 24px 16px; text-align: center; font-size: 13px; color: var(--text3); }
  .prep-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
  .prep-item:last-child { border-bottom: none; }
  .field-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field-label:first-child { margin-top: 0; }
  .next-step-display { font-size: 13px; color: var(--text2); background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; line-height: 1.6; white-space: pre-wrap; }
  textarea, input[type="url"], input[type="text"], input[type="date"], input[type="time"], input[type="number"] { width: 100%; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg); line-height: 1.5; }
  textarea { resize: vertical; min-height: 64px; }
  textarea.auto-expand { resize: none; overflow: hidden; min-height: 64px; }
  textarea:focus, input:focus { outline: none; border-color: var(--blue); }
  textarea::placeholder, input::placeholder { color: var(--text3); }
  .save-row { display: flex; align-items: center; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
  .save-btn { padding: 7px 16px; font-size: 13px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: none; cursor: pointer; color: var(--text2); font-family: inherit; }
  .save-btn:hover { background: var(--bg); }
  .saved-tag { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; }
  .add-row { padding: 10px 16px; border-top: 0.5px solid var(--border); }
  .empty-note { font-size: 13px; color: var(--text3); padding: 10px 16px 4px; }
  .plan-row { padding: 8px 0; border-bottom: 0.5px solid var(--border); }
  .plan-row-name { font-size: 13px; color: var(--text); }
  .plan-row-file { font-size: 11px; color: var(--green); }
  .plan-row-none { font-size: 11px; color: var(--text3); }
  @media (max-width: 480px) {
    body { padding: 0.75rem 0.5rem 3rem; }
    .header h1 { font-size: 17px; }
    .container { max-width: 100%; }
    .tab-btn { padding: 5px 10px; font-size: 12px; }
    .section-tabs { gap: 5px; }
    .add-row { display: flex; flex-direction: column; gap: 6px; }
    .add-row input { width: 100%; }
    .add-row .save-btn { width: 100%; }
    .header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>Brady's to-do list</h1>
      <button class="settings-btn" id="settings-btn" title="Settings &amp; Reminders">&#9881;</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="sync-status" style="font-size:11px;color:var(--text3)"></span>
      <button class="tab-btn" data-tab="mary" style="padding:4px 12px;font-size:12px">Mary</button>
    </div>
  </div>
  <div id="reminder-banner" class="reminder-banner"></div>
  <div class="section-tabs">
    <button class="tab-btn" data-tab="intake">Main</button>
    <button class="tab-btn" data-tab="day">Today</button>
    <button class="tab-btn" data-tab="events">Events</button>
    <button class="tab-btn active" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="ongoing">Ongoing tasks</button>
    <button class="tab-btn" data-tab="support">Support</button>
  </div>
  <div id="tab-intake" style="display:none"></div>
  <div id="tab-day" style="display:none"></div>
  <div id="tab-projects"></div>
  <div id="tab-ongoing" style="display:none"></div>
  <div id="tab-events" style="display:none"></div>
  <div id="tab-mary" style="display:none"></div>
  <div id="tab-support" style="display:none"></div>
</div>

<!-- Calendar overlay -->
<div class="cal-overlay" id="cal-overlay" style="display:none">
  <div class="cal-backdrop" id="cal-backdrop"></div>
  <div class="cal-popup">
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">&#8249;</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-nav" id="cal-next">&#8250;</button>

const GIST_ID = '9a7acd951b273f4014d842f96d769d11';
const GIST_FILENAME = 'brady-todo-data.json';
const GIST_API = 'https://api.github.com/gists/'+GIST_ID;
function getGistToken(){return localStorage.getItem('gist_token')||'';}
let saveQueued = false;
let saveTimer = null;

// localStorage — always used as fast local cache
function loadLocal(){try{const r=localStorage.getItem('tracker_v5');return r?JSON.parse(r):null;}catch{return null;}}
function saveLocal(d){try{localStorage.setItem('tracker_v5',JSON.stringify(d));}catch{}}

// Gist sync
async function loadFromGist(){
  const resp=await fetch(GIST_API,{headers:{Authorization:'token '+getGistToken(),'Accept':'application/vnd.github.v3+json'}});
  if(!resp.ok)throw new Error('Gist fetch failed: '+resp.status);
  const gist=await resp.json();
  const file=gist.files&&gist.files[GIST_FILENAME];
  if(!file)throw new Error('File not found in Gist');
  const content=file.truncated?await(await fetch(file.raw_url)).text():file.content;
  return JSON.parse(content);
}

async function saveToGist(d){
  const files={};
  files[GIST_FILENAME]={content:JSON.stringify(d)};
  const resp=await fetch(GIST_API,{
    method:'PATCH',
    headers:{Authorization:'token '+getGistToken(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({files})
  });
  if(!resp.ok)throw new Error('Gist save failed: '+resp.status);
}

function updateSyncStatus(state){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='font-size:11px;padding:2px 8px;border-radius:20px;flex-shrink:0';
    const header=document.querySelector('.header-left');
    if(header)header.appendChild(el);
  }
  const states={
    syncing:{text:'Syncing…',bg:'var(--amber-bg)',color:'var(--amber)'},
    synced:{text:'✓ Synced',bg:'var(--green-bg)',color:'var(--green)'},
    error:{text:'Sync error',bg:'var(--red-bg)',color:'var(--red)'},
    local:{text:'Local only',bg:'var(--bg2)',color:'var(--text3)'},
    saving:{text:'Saving…',bg:'var(--blue-bg)',color:'var(--blue)'}
  };
  const s=states[state]||states.local;
  el.textContent=s.text;el.style.background=s.bg;el.style.color=s.color;
}

// Debounced save — writes to Drive + localStorage
function save(d){
  saveLocal(d);
  if(!getGistToken()){return;}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    updateSyncStatus('saving');
    saveToGist(d).then(function(){
      updateSyncStatus('synced');
    }).catch(function(e){
      updateSyncStatus('error:'+e.message);
      console.error('Gist save error:',e);
    });
  },1500);
}

function dateKey(o){const d=new Date();d.setDate(d.getDate()+(o||0));return d.toISOString().split('T')[0];}
function todayKey(){return dateKey(0);}
function formatDate(key){
  const [y,m,d]=key.split('-').map(Number);
  const date=new Date(y,m-1,d);
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((date-today)/86400000);
  if(diff===0)return'Today';if(diff===-1)return'Yesterday';
  return date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=d;grid.appendChild(e);});
  const firstDay=new Date(calViewYear,calViewMonth,1).getDay();
  const dim=new Date(calViewYear,calViewMonth+1,0).getDate();
  for(let i=0;i<firstDay;i++){const b=document.createElement('div');b.className='cal-day empty';grid.appendChild(b);}
  for(let d=1;d<=dim;d++){
    const date=new Date(calViewYear,calViewMonth,d);
    const key=date.toISOString().split('T')[0];
    const el=document.createElement('div');el.className='cal-day';el.textContent=d;
    if(date>today)el.classList.add('future');
    if(date.getTime()===today.getTime())el.classList.add('today');
    if(key===selKey)el.classList.add('selected');
    el.addEventListener('click',()=>{offset=Math.round((date-today)/86400000);closeCalendar();render();});
    grid.appendChild(el);
  }
  const now=new Date();
  const noNext=calViewYear>now.getFullYear()||(calViewYear===now.getFullYear()&&calViewMonth>=now.getMonth());
  document.getElementById('cal-next').style.opacity=noNext?'0.3':'1';
  document.getElementById('cal-next').style.pointerEvents=noNext?'none':'auto';
}
document.getElementById('cal-prev').addEventListener('click',()=>{calViewMonth--;if(calViewMonth<0){calViewMonth=11;calViewYear--;}renderCalendar();});
document.getElementById('cal-next').addEventListener('click',()=>{calViewMonth++;if(calViewMonth>11){calViewMonth=0;calViewYear++;}renderCalendar();});
document.getElementById('cal-backdrop').addEventListener('click',closeCalendar);
const dateLabel=document.getElementById('date-label');if(dateLabel)dateLabel.addEventListener('click',openCalendar);

function renderReminderBanner(){
  const banner=document.getElementById('reminder-banner');
  banner.innerHTML='';
  const today=todayKey();
  const due=[];
  // Standalone reminders
  (app.reminders||[]).forEach(r=>{
    if(r.date===today&&!r.dismissed) due.push({id:r.id,name:r.name,note:r.note||'',type:'standalone'});
  });
  // Project next-step reminders
  allProjects().forEach(p=>{
    if(p.remindDate===today) due.push({id:'proj-'+p.id,name:p.name,note:p.nextStep||'',type:'project'});
  });
  due.forEach(item=>{
    const card=document.createElement('div');
    card.className='reminder-card';
    card.innerHTML=`
      <div class="reminder-card-text">
        <div class="reminder-card-name">&#128276; ${esc(item.name)}</div>
        ${item.note?`<div class="reminder-card-note">${esc(item.note)}</div>`:''}
      </div>
      <button class="reminder-dismiss" data-id="${item.id}" data-type="${item.type}" title="Dismiss">&#215;</button>
    `;
    banner.appendChild(card);
  });
  banner.querySelectorAll('.reminder-dismiss').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.type==='standalone'){
        app.reminders=app.reminders.filter(r=>r.id!==btn.dataset.id);
      } else {
        const pid=btn.dataset.id.replace('proj-','');
        const p=findProject(pid);
        if(p) p.remindDate='';
      }
      save(app);renderReminderBanner();renderSettingsPanel();
    });
  });
}

function renderSettingsPanel(){
  // Weekly plans section
  const plansList=document.getElementById('plans-list');
  if(plansList){
    plansList.innerHTML='';
    const projects=allProjects();
    if(projects.length===0){plansList.innerHTML='<div style="font-size:13px;color:var(--text3);padding:4px 0">No current projects yet</div>';}

      wrapper.innerHTML=
        '<div class="plan-row" style="cursor:pointer" data-p="'+p.id+'">'

        +'<label class="plan-upload-label" style="flex-shrink:0">&#128196; Upload PDF<input type="file" accept=".pdf" class="plan-file-input" data-p="'+p.id+'" style="display:none" /></label>'
        +'<span class="plan-status-msg" data-p="'+p.id+'" style="font-size:12px;color:var(--text3)"></span>'

        +'<div class="field-label" style="margin-top:0">Or paste plan text</div>'
        +'<textarea class="plan-paste-inp" data-p="'+p.id+'" placeholder="Paste your weekly plan text here…" style="min-height:100px;font-size:12px">'+esc(p.weeklyPlan||'')+'</textarea>'
        +'<div style="display:flex;align-items:center;gap:8px;margin-top:8px">'
        +'<button class="save-btn plan-paste-save" data-p="'+p.id+'">Save text</button>'
        +'<span class="saved-tag plan-paste-saved">Saved ✓</span>'
        +(p.weeklyPlan?'<button class="save-btn plan-clear" data-p="'+p.id+'" style="color:var(--red)">Clear</button>':'')
        +'</div>'
        +'</div>';
      plansList.appendChild(wrapper);
    });

    // Toggle expand
    plansList.querySelectorAll('.plan-row[data-p]').forEach(row=>{
      row.addEventListener('click',()=>{
        const p=allProjects().find(pr=>pr.id===row.dataset.p);
        if(p){p._planExpanded=!p._planExpanded;renderSettingsPanel();}
      });
    });

    // PDF upload
    plansList.querySelectorAll('.plan-file-input').forEach(inp=>{
      inp.addEventListener('change',async()=>{
        const file=inp.files[0];if(!file)return;
        const p=allProjects().find(pr=>pr.id===inp.dataset.p);if(!p)return;
        const msg=plansList.querySelector('.plan-status-msg[data-p="'+inp.dataset.p+'"]');
        if(msg)msg.textContent='Reading PDF…';
        const reader=new FileReader();
        reader.onload=async()=>{
          const base64=reader.result.split(',')[1];
          try{
            const resp=await fetch('https://api.anthropic.com/v1/messages',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:3000,
                messages:[{role:'user',content:[
                  {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
                  {type:'text',text:'Extract all text from this PDF exactly as written. Return only the raw text, no commentary.'}
                ]}]})
            });
            const data=await resp.json();
            const text=data.content?.find(c=>c.type==='text')?.text||'';
            if(!text){if(msg)msg.textContent='No text found — try pasting instead';return;}
            p.weeklyPlan=text;p.weeklyPlanName=file.name;
            save(app);if(msg)msg.textContent='';renderSettingsPanel();
          }catch(e){if(msg)msg.textContent='Error — try pasting text instead';}
        };
        reader.readAsDataURL(file);
      });
    });

    // Paste save
    plansList.querySelectorAll('.plan-paste-save').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const p=allProjects().find(pr=>pr.id===btn.dataset.p);if(!p)return;
        const ta=plansList.querySelector('textarea.plan-paste-inp[data-p="'+btn.dataset.p+'"]');
        if(ta){p.weeklyPlan=ta.value.trim();if(!p.weeklyPlanName)p.weeklyPlanName='Pasted text';}
        save(app);
        const tag=btn.nextElementSibling;if(tag){tag.style.opacity='1';setTimeout(()=>{tag.style.opacity='0';},2000);}
        renderSettingsPanel();
      });
    });

    // Clear plan
    plansList.querySelectorAll('.plan-clear').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const p=allProjects().find(pr=>pr.id===btn.dataset.p);if(!p)return;
        p.weeklyPlan='';p.weeklyPlanName='';save(app);renderSettingsPanel();
      });
    });
  }

  // Sign out — update label based on auth state
  const signOutBtn=document.getElementById('sign-out-btn');
  if(signOutBtn){
    signOutBtn.textContent=window._gdriveToken?(window._gdriveUserEmail?window._gdriveUserEmail+' · Sign out':'Sign out'):'Sign in';
    signOutBtn.onclick=()=>{
      if(!window._gdriveToken){
        document.getElementById('settings-overlay').style.display='none';
        showAuthPrompt();
        return;
      }
      if(confirm('Sign out of '+( window._gdriveUserEmail||'your account')+'?')){
        window._gdriveToken=null;
        window._gdriveUserEmail=null;
        driveFileId=null;
        updateSyncStatus('local');
        document.getElementById('settings-overlay').style.display='none';
        showAuthPrompt();
      }
    };
  }
  const list=document.getElementById('reminders-list');
  list.innerHTML='';
  const sorted=[...(app.reminders||[])].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length===0){list.innerHTML='<div style="font-size:13px;color:var(--text3);padding:4px 0">No reminders yet</div>';return;}
  sorted.forEach(r=>{
    const div=document.createElement('div');div.className='reminder-item';
    const d=new Date(r.date+'T00:00:00');
    const label=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const isEditing=r._editing||false;
    div.innerHTML=isEditing?`
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <input type="text" class="rem-edit-name" data-id="${r.id}" value="${esc(r.name)}" placeholder="Name" />
        <input type="date" class="rem-edit-date" data-id="${r.id}" value="${esc(r.date)}" />
        <input type="text" class="rem-edit-note" data-id="${r.id}" value="${esc(r.note||'')}" placeholder="Note (optional)" />
        <div style="display:flex;gap:6px">
          <button class="save-btn rem-save" data-id="${r.id}" style="flex:1">Save</button>
          <button class="save-btn rem-cancel" data-id="${r.id}">Cancel</button>
        </div>
      </div>`:`
      <div class="reminder-item-info">
        <div class="reminder-item-name">${esc(r.name)}${r.dismissed?' <span style="color:var(--text3);font-size:11px">(dismissed)</span>':''}</div>
        <div class="reminder-item-date">${label}${r.note?' · '+esc(r.note):''}</div>
      </div>
      <button class="reminder-item-edit" data-id="${r.id}" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);padding:2px 4px" title="Edit">&#9998;</button>
      <button class="reminder-item-del" data-id="${r.id}" title="Delete">&#215;</button>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('.reminder-item-edit').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const r=app.reminders.find(x=>x.id===btn.dataset.id);if(!r)return;
      r._editing=true;renderSettingsPanel();
    });
  });
  list.querySelectorAll('.rem-cancel').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const r=app.reminders.find(x=>x.id===btn.dataset.id);if(!r)return;
      r._editing=false;renderSettingsPanel();
    });
  });
  list.querySelectorAll('.rem-save').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const r=app.reminders.find(x=>x.id===btn.dataset.id);if(!r)return;
      const nameEl=list.querySelector('.rem-edit-name[data-id="'+btn.dataset.id+'"]');
      const dateEl=list.querySelector('.rem-edit-date[data-id="'+btn.dataset.id+'"]');
      const noteEl=list.querySelector('.rem-edit-note[data-id="'+btn.dataset.id+'"]');
      if(nameEl)r.name=nameEl.value.trim();
      if(dateEl)r.date=dateEl.value;
      if(noteEl)r.note=noteEl.value.trim();
      r._editing=false;
      save(app);renderSettingsPanel();renderReminderBanner();
    });
  });
  list.querySelectorAll('.reminder-item-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      app.reminders=app.reminders.filter(r=>r.id!==btn.dataset.id);
      save(app);renderSettingsPanel();renderReminderBanner();
    });
  });

  // Gist token input — populate from localStorage
  const gistInp=document.getElementById('gist-token-inp');
  if(gistInp) gistInp.value=localStorage.getItem('gist_token')||'';

  // Export
  const exportBtn=document.getElementById('export-btn');
  if(exportBtn){
    exportBtn.onclick=()=>{
      const data=JSON.stringify(app,null,2);
      const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='brady-todo-backup.json';
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);URL.revokeObjectURL(url);
    };
  }

  // Import
  const importInput=document.getElementById('import-input');
  if(importInput){
    importInput.onchange=(e)=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();

          const data=JSON.parse(ev.target.result);
          localStorage.setItem('tracker_v5',JSON.stringify(data));
          setTimeout(()=>location.reload(),500);

      reader.readAsText(file);

  // Reload from Gist
  const reloadDriveBtn=document.getElementById('reload-drive-btn');
  if(reloadDriveBtn){
    reloadDriveBtn.onclick=async()=>{
      document.getElementById('settings-overlay').style.display='none';

function renderProjects(){
  const key=dateKey(offset);
  const container=document.getElementById('tab-projects');
  container.innerHTML='';

  app.domains.forEach(domain=>{
    const total=domain.categories.reduce((a,c)=>a+c.projects.length,0);
    const isOpen=domain._open||false;
    const el=document.createElement('div');el.className='block';
    el.innerHTML=`
      <div class="block-header">
        <span class="block-title">&#128193; ${esc(domain.name)} <span class="block-meta">${total} project${total!==1?'s':''}</span></span>
        <span class="chevron ${isOpen?'open':''}">&#8964;</span>
      </div>
      <div class="block-body ${isOpen?'open':''}">
        ${domain.categories.map(cat=>renderProjCat(cat,key,domain)).join('')}
      </div>
    `;
    container.appendChild(el);
    el.querySelector('.block-header').addEventListener('click',()=>{domain._open=!domain._open;renderProjects();});
    el.querySelectorAll('.cat-hdr-row').forEach(h=>{
      h.addEventListener('click',(e)=>{
        e.stopPropagation();
        let cat=null;
        app.domains.forEach(d=>d.categories.forEach(c=>{if(c.id===h.dataset.cat)cat=c;}));
        if(cat){cat._open=!cat._open;save(app);renderProjects();}
        else{console.warn('cat not found for id:',h.dataset.cat);}
      });
    });
    el.querySelectorAll('.proj-name-row').forEach(r=>{
      r.addEventListener('click',()=>{const p=findProject(r.dataset.p);if(p){p._open=!p._open;renderProjects();}});
    });
    el.querySelectorAll('.proj-toggle').forEach(b=>{
      b.addEventListener('click',()=>{const p=findProject(b.dataset.p);if(p){p._open=!p._open;renderProjects();}});
    });
    el.querySelectorAll('.link-btn').forEach(b=>{
      b.addEventListener('click',e=>{
        e.stopPropagation();
        const p=findProject(b.dataset.p);if(!p)return;
        if(p.threadUrl)window.open(p.threadUrl,'_blank');
        else{p._open=true;renderProjects();setTimeout(()=>{const inp=el.querySelector(`input[data-type="url"][data-p="${p.id}"]`);if(inp)inp.focus();},50);}
      });
    });

    el.querySelectorAll('.proj-save').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const pid=btn.dataset.p;const p=findProject(pid);if(!p)return;
        const next=el.querySelector('textarea[data-type="next"][data-p="'+pid+'"]');
        const url=el.querySelector('input[data-type="url"][data-p="'+pid+'"]');
        const win=el.querySelector('input[data-type="window"][data-p="'+pid+'"]');
        const planText=el.querySelector('textarea.proj-plan-text[data-p="'+pid+'"]');
        const planDeadline=el.querySelector('input.proj-plan-deadline[data-p="'+pid+'"]');
        const dueEl=el.querySelector('.proj-due-date[data-p="'+pid+'"]')||el.querySelector('.proj-due-date');
        const renameEl=el.querySelector('.proj-rename-inp');
        // Also save ns/wi/links from body
        const body=btn.closest('.proj-body');
        if(body){
          const nsInps=body.querySelectorAll('.ns-inp[data-p="'+pid+'"]');
          const nsChks=body.querySelectorAll('.ns-chk[data-p="'+pid+'"]');
          if(nsInps.length)p.nextSteps=Array.from(nsInps).map((inp,i)=>({id:(p.nextSteps&&p.nextSteps[i])?p.nextSteps[i].id:'ns-'+Date.now()+i,text:inp.value.trim(),done:nsChks[i]?nsChks[i].checked:false})).filter(s=>s.text);
          const wiInps=body.querySelectorAll('.wi-inp');
          if(wiInps.length>=0)p.waitingItems=Array.from(wiInps).map((inp,i)=>({id:(p.waitingItems&&p.waitingItems[i])?p.waitingItems[i].id:'wi-'+Date.now()+i,text:inp.value.trim()})).filter(w=>w.text);
          const lnkLabels=body.querySelectorAll('.lnk-label');
          const lnkUrls=body.querySelectorAll('.lnk-url');
          if(lnkLabels.length>=0)p.links=Array.from(lnkLabels).map((lbl,i)=>({id:(p.links&&p.links[i])?p.links[i].id:'lnk-'+Date.now()+i,label:lbl.value.trim(),url:lnkUrls[i]?lnkUrls[i].value.trim():''})).filter(l=>l.url);
          const dueInBody=body.querySelector('.proj-due-date');if(dueInBody)p.dueDate=dueInBody.value;
          const renameInBody=body.querySelector('.proj-rename-inp');if(renameInBody&&renameInBody.value.trim())p.name=renameInBody.value.trim();
          const planTextInBody=body.querySelector('.proj-plan-text');if(planTextInBody)p.weeklyPlan=planTextInBody.value;
          const planDlInBody=body.querySelector('.proj-plan-deadline');if(planDlInBody)p.planDeadline=planDlInBody.value;
          const hasPlanChk=body.querySelector('.proj-has-plan-chk');if(hasPlanChk)p.hasWeeklyPlan=hasPlanChk.checked;
          // Save wt inputs
          body.querySelectorAll('.wt-inp').forEach(inp=>{
            const p2=findProject(inp.dataset.p);if(!p2)return;
            if(!p2.weeklyTasks)p2.weeklyTasks={};
            if(!p2.weeklyTasks[inp.dataset.mon])p2.weeklyTasks[inp.dataset.mon]=[];
            const ti=parseInt(inp.dataset.ti);
            if(p2.weeklyTasks[inp.dataset.mon][ti])p2.weeklyTasks[inp.dataset.mon][ti].text=inp.value.trim();
          });
        }
        if(next)p.nextStep=next.value;
        if(url)p.threadUrl=url.value.trim();
        if(win)p.targetWindow=win.value;
        if(planText)p.weeklyPlan=planText.value;
        if(planDeadline)p.planDeadline=planDeadline.value;
        p.nextStep=p.nextSteps&&p.nextSteps[0]?p.nextSteps[0].text:'';
        // Future idea notes
        const futureNotes=body?body.querySelector('.future-notes'):null;
        if(futureNotes)p.notes=futureNotes.value;
        const futureRename=body?body.querySelector('.future-rename-inp'):null;
        if(futureRename&&futureRename.value.trim())p.name=futureRename.value.trim();
        p._editing=false;
        save(app);flashSaved(btn);renderProjects();renderReminderBanner();
      });
    });
    el.querySelectorAll('.proj-has-plan-chk').forEach(chk=>{
      chk.addEventListener('change',()=>{
        const p=findProject(chk.dataset.p);if(!p)return;
        p.hasWeeklyPlan=chk.checked;
        save(app);renderProjects();
      });
    });
    el.querySelectorAll('.proj-edit-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{const p=findProject(btn.dataset.p);if(p){p._editing=true;p._open=true;renderProjects();}});
    });
    el.querySelectorAll('.proj-cancel').forEach(btn=>{
      btn.addEventListener('click',()=>{const p=findProject(btn.dataset.p);if(p){p._editing=false;renderProjects();}});
    });


    el.querySelectorAll('.add-input').forEach(inp=>{
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&inp.value.trim()){
          let targetCat=null;
          app.domains.forEach(d=>d.categories.forEach(c=>{if(c.id===inp.dataset.cat)targetCat=c;}));
          const dom=app.domains.find(d=>d.categories.some(c=>c.id===inp.dataset.cat));
          if(targetCat&&dom){
            const isFuture=targetCat.name.toLowerCase().includes('future');
            const newProj={id:inp.dataset.cat+'-'+Date.now(),name:inp.value.trim(),nextStep:'',threadUrl:''};
            if(isFuture)newProj.targetWindow='';
            else{newProj.remindDate='';newProj.weeklyPlan='';newProj.weeklyPlanName='';}
            targetCat.projects.push(newProj);
            dom._open=true;targetCat._open=true;save(app);renderProjects();
          }
        }
      });
    });
  });
}

function renderProjCat(cat,key,domain){
  const open=cat._open||false;
  const isFuture=cat.name.toLowerCase().includes('future');
  const ph=isFuture?'+ Add idea…':'+ Add project…';
  return `
    <div>
      <div class="cat-hdr-row" data-cat="${cat.id}">
        <span class="cat-title"><span class="cat-chevron ${open?'open':''}">&#8250;</span>${esc(cat.name)}</span>
        <span style="font-size:12px;color:var(--text3)">${cat.projects.length}</span>
      </div>
      <div class="cat-body ${open?'open':''}">
        ${cat.projects.length===0?'<div class="empty-note">No projects yet</div>':[...cat.projects].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>isFuture?renderFutureRow(p,key):renderProjRow(p,key)).join('')}
        <div class="add-row"><input type="text" placeholder="${ph}" data-cat="${cat.id}" class="add-input" /></div>
      </div>
    </div>`;
}

function renderProjRow(p,key){
  const pOpen=p._open||false;
  const isEditing=p._editing||false;
  const hasNext=p.nextSteps&&p.nextSteps.some(s=>!s.done&&s.text.trim());
  const hasWaiting=p.waitingItems&&p.waitingItems.length>0;
  const dotColor=hasNext?'var(--green)':hasWaiting?'var(--amber)':'var(--border2)';

  // Due date color
  let dueBadge='';
  if(p.dueDate){
    const days=Math.ceil((new Date(p.dueDate+'T00:00:00')-new Date())/(1000*60*60*24));
    const dcolor=days<=30?'var(--red)':days<=90?'var(--amber)':'var(--green)';
    const dlabel=new Date(p.dueDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const daysLabel=days>0?days+' days':days===0?'Today':Math.abs(days)+' days ago';
    dueBadge='<span style="font-size:11px;padding:2px 7px;border-radius:20px;background:'+dcolor+'20;color:'+dcolor+';margin-left:6px">'+dlabel+' ('+daysLabel+')</span>';
  }

  // Next steps list
  const nextSteps=p.nextSteps||[];
  const waitingItems=p.waitingItems||[];
  const links=p.links||[];

  let bodyHtml='';
  if(isEditing){
    // Next steps edit
    bodyHtml+='<div class="field-label">Next steps</div>';
    nextSteps.forEach((s,si)=>{
      bodyHtml+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
      bodyHtml+='<input type="checkbox" class="ns-chk" data-p="'+p.id+'" data-si="'+si+'" style="accent-color:var(--blue);cursor:pointer" '+(s.done?'checked ':'')+'/>';
      bodyHtml+='<input type="text" class="ns-inp" data-p="'+p.id+'" data-si="'+si+'" value="'+esc(s.text)+'" style="flex:1;font-size:13px" />';
      bodyHtml+='<button class="ns-del" data-si="'+si+'" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)">&#215;</button>';
      bodyHtml+='</div>';
    });
    bodyHtml+='<div style="display:flex;gap:6px;margin-bottom:10px"><input type="text" class="ns-new-inp" placeholder="Add next step…" style="flex:1;font-size:13px"/><button class="save-btn ns-add-btn" style="padding:4px 10px">Add</button></div>';

    // Waiting items edit
    bodyHtml+='<div class="field-label">Waiting on</div>';
    waitingItems.forEach((w,wi)=>{
      bodyHtml+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
      bodyHtml+='<input type="text" class="wi-inp" data-wi="'+wi+'" value="'+esc(w.text)+'" style="flex:1;font-size:13px" />';
      bodyHtml+='<button class="wi-del" data-wi="'+wi+'" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)">&#215;</button>';
      bodyHtml+='</div>';
    });
    bodyHtml+='<div style="display:flex;gap:6px;margin-bottom:10px"><input type="text" class="wi-new-inp" placeholder="Add waiting item…" style="flex:1;font-size:13px"/><button class="save-btn wi-add-btn" style="padding:4px 10px">Add</button></div>';

    // Links edit
    bodyHtml+='<div class="field-label">Links</div>';
    links.forEach((lnk,li)=>{
      bodyHtml+='<div style="display:flex;gap:6px;margin-bottom:4px">';
      bodyHtml+='<input type="text" class="lnk-label" data-li="'+li+'" value="'+esc(lnk.label)+'" placeholder="Label" style="width:80px;font-size:12px"/>';
      bodyHtml+='<input type="url" class="lnk-url" data-li="'+li+'" value="'+esc(lnk.url)+'" placeholder="https://…" style="flex:1;font-size:12px"/>';
      bodyHtml+='<button class="lnk-del" data-li="'+li+'" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)">&#215;</button>';
      bodyHtml+='</div>';
    });
    bodyHtml+='<div style="display:flex;gap:6px;margin-bottom:10px"><input type="text" class="lnk-new-label" placeholder="Label" style="width:80px;font-size:12px"/><input type="url" class="lnk-new-url" placeholder="https://…" style="flex:1;font-size:12px"/><button class="save-btn lnk-add-btn" style="padding:4px 10px">Add</button></div>';

    // Due date
    bodyHtml+='<div class="field-label">Due date</div>';
    bodyHtml+='<input type="date" class="proj-due-date" data-p="'+p.id+'" value="'+esc(p.dueDate||'')+'" style="margin-bottom:10px"/>';

    // Rename project
    bodyHtml+='<div class="field-label">Project name</div>';
    bodyHtml+='<input type="text" class="proj-rename-inp" value="'+esc(p.name)+'" style="margin-bottom:10px;width:100%"/>';

    // Weekly plan toggle
    bodyHtml+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
    bodyHtml+='<label style="font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em">Weekly plan</label>';
    bodyHtml+='<input type="checkbox" class="proj-has-plan-chk" data-p="'+p.id+'" '+(p.hasWeeklyPlan?'checked ':'')+ 'style="accent-color:var(--blue);cursor:pointer" />';
    bodyHtml+='</div>';
    if(p.hasWeeklyPlan){
      // Build upcoming Mondays
      const mondays2=[];
      const md=new Date();md.setHours(0,0,0,0);
      const mdow=md.getDay();md.setDate(md.getDate()+(mdow===0?-6:1-mdow));
      for(let i=0;i<12;i++){const wk=new Date(md);wk.setDate(md.getDate()+i*7);mondays2.push(wk.toISOString().split('T')[0]);}
      const wt=p.weeklyTasks||{};
      bodyHtml+='<div class="field-label">Weekly tasks by week</div>';
      mondays2.forEach(mon=>{
        const wtasks=wt[mon]||[];
        const mlabel=new Date(mon+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
        bodyHtml+='<div style="margin-bottom:8px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:8px 10px">';
        bodyHtml+='<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">Week of '+mlabel+'</div>';
        wtasks.forEach((t,ti)=>{
          bodyHtml+='<div style="display:flex;gap:6px;margin-bottom:4px"><input type="checkbox" class="wt-chk" data-p="'+p.id+'" data-mon="'+mon+'" data-ti="'+ti+'" '+(t.done?'checked ':'')+' style="accent-color:var(--blue);cursor:pointer;flex-shrink:0;margin-top:2px"/><input type="text" class="wt-inp" data-p="'+p.id+'" data-mon="'+mon+'" data-ti="'+ti+'" value="'+esc(t.text)+'" style="flex:1;font-size:12px"/><button class="wt-del" data-p="'+p.id+'" data-mon="'+mon+'" data-ti="'+ti+'" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3)">&#215;</button></div>';
        });
        bodyHtml+='<div style="display:flex;gap:6px"><input type="text" class="wt-new-inp" data-p="'+p.id+'" data-mon="'+mon+'" placeholder="Add task for week of '+mlabel+'…" style="flex:1;font-size:12px"/><button class="save-btn wt-add-btn" data-p="'+p.id+'" data-mon="'+mon+'" style="padding:4px 8px;font-size:12px">Add</button></div>';
        bodyHtml+='</div>';
      });
    }

    bodyHtml+='<div class="save-row"><button class="save-btn proj-save" data-p="'+p.id+'">Save</button><span class="saved-tag">Saved ✓</span><button class="edit-btn proj-cancel" data-p="'+p.id+'" style="margin-left:8px">Cancel</button><button class="save-btn proj-delete" data-p="'+p.id+'" style="color:var(--red);margin-left:8px">Delete project</button></div>';
  } else {
    // View mode: next steps
    if(nextSteps.length>0){
      bodyHtml+='<div class="field-label">Next steps</div>';
      nextSteps.forEach((s,si)=>{
        const isFlagged=app.currentTasks&&app.currentTasks.some(c=>c.sourceType==='nextStep'&&c.sourceProjectId===p.id&&c.sourceNsIdx===si);
        bodyHtml+='<div style="display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;'+(isFlagged?'background:#fff3cd;':'')+'">';
        bodyHtml+='<input type="checkbox" class="ns-view-chk" data-p="'+p.id+'" data-si="'+si+'" '+(s.done?'checked ':'')+ 'style="accent-color:var(--blue);cursor:pointer;flex-shrink:0" />';
        bodyHtml+='<span style="font-size:13px;flex:1;'+(isFlagged?'font-weight:700;color:#7d5a00;':'color:var(--text2);')+(s.done?'text-decoration:line-through;opacity:0.5':'')+ '">'+(isFlagged?'&#128681; ':'')+esc(s.text)+'</span>';
        bodyHtml+='<button class="ns-flag" data-p="'+p.id+'" data-si="'+si+'" data-text="'+esc(s.text)+'" style="background:none;border:none;cursor:pointer;font-size:15px;color:'+(isFlagged?'#dc3545':'#aaa')+';padding:2px 4px" title="'+(isFlagged?'Remove from Current tasks':'Add to Current tasks')+'">&#128681;</button>';
        bodyHtml+='</div>';
      });
    }
    if(waitingItems.length>0){
      bodyHtml+='<div class="field-label" style="margin-top:8px">Waiting on</div>';
      waitingItems.forEach(w=>{bodyHtml+='<div style="font-size:13px;color:var(--amber);padding:2px 0">⏳ '+esc(w.text)+'</div>';});
    }
    if(links.length>0){
      bodyHtml+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
      links.forEach(lnk=>{bodyHtml+='<a href="'+esc(lnk.url)+'" target="_blank" class="edit-btn" style="text-decoration:none;font-size:12px">&#128279; '+esc(lnk.label)+'</a>';});
      bodyHtml+='</div>';
    }
    bodyHtml+='<div style="margin-top:10px"><button class="edit-btn proj-edit-btn" data-p="'+p.id+'">&#9998; Edit</button></div>';
  }

  return '<div class="proj-row">'+
    '<div class="proj-hdr">'+
    '<div class="proj-name-row" data-p="'+p.id+'"><span class="dot" style="background:'+dotColor+'"></span><span class="proj-name">'+esc(p.name)+'</span>'+dueBadge+'</div>'+
    '<button class="icon-btn proj-toggle" data-p="'+p.id+'"><span class="chevron '+(pOpen?'open ':'')+ '" style="font-size:13px">&#8964;</span></button>'+
    '</div>'+
    '<div class="proj-body '+(pOpen?'open ':'')+ '">'+bodyHtml+'</div>'+
    '</div>';
}

function renderFutureRow(p,key){
  const pOpen=p._open||false;
  const hasLink=(p.links&&p.links.length&&p.links.some(l=>l.url))||(p.threadUrl&&p.threadUrl.trim());
  const win=p.targetWindow&&p.targetWindow.trim();
  return `
    <div class="proj-row">
      <div class="proj-hdr">
        <div class="proj-name-row" data-p="${p.id}">
          <span class="proj-name">${esc(p.name)}</span>
          ${win?`<span class="window-badge">${esc(win)}</span>`:''}
        </div>
        <button class="icon-btn link-btn ${hasLink?'active':''}" data-p="${p.id}" title="${hasLink?'Open thread':'Add thread link'}">${hasLink?'&#128279;':'&#128279;'}</button>
        <button class="icon-btn proj-toggle" data-p="${p.id}"><span class="chevron ${pOpen?'open':''}" style="font-size:13px">&#8964;</span></button>
      </div>
      <div class="proj-body ${pOpen?'open':''}">
        <div class="field-label">Idea name</div>
        <input type="text" class="future-rename-inp" data-p="${p.id}" value="${esc(p.name)}" style="margin-bottom:8px;width:100%" />
        <div class="field-label">Notes</div>
        <textarea class="future-notes" data-p="${p.id}" placeholder="Notes or initial thoughts…">${esc(p.nextStep||p.notes||'')}</textarea>
        <div class="field-label">Target window</div>
        <input type="text" data-type="window" data-p="${p.id}" placeholder="e.g. Jun–Aug 2026" value="${esc(p.targetWindow||'')}" />
        <div class="field-label">Claude thread URL</div>
        <input type="url" data-type="url" data-p="${p.id}" placeholder="https://claude.ai/chat/..." value="${esc(p.threadUrl)}" />
        <div class="save-row"><button class="save-btn proj-save" data-p="${p.id}">Save</button><span class="saved-tag">Saved ✓</span><button class="edit-btn future-promote" data-p="${p.id}" style="margin-left:8px">&#8593; Move to Current Projects</button><button class="save-btn future-delete" data-p="${p.id}" style="color:var(--red);margin-left:8px">Delete</button></div>
      </div>
    </div>`;
}

// ── ONGOING ───────────────────────────────────────────────────
function renderOngoing(){
  const container=document.getElementById('tab-ongoing');container.innerHTML='';
  const dayKey=dateKey(offset);const checks=getDailyChecks(dayKey);
  const daily=app.ongoing.daily||[];
  const dailyOpen=app.ongoing._open_daily||false;
  const doneCount=daily.filter(d=>checks[d.id]&&checks[d.id].checked).length;
  const pct=daily.length?Math.round(doneCount/daily.length*100):0;
  const dailyEl=document.createElement('div');dailyEl.className='block';
  dailyEl.innerHTML=`
    <div class="block-header">
      <span class="block-title">&#9989; Daily checklist <span class="block-meta">${doneCount}/${daily.length}</span></span>
      <span class="chevron ${dailyOpen?'open':''}">&#8964;</span>
    </div>
    <div class="block-body ${dailyOpen?'open':''}">
      <div class="checklist-progress">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>
      ${daily.map(item=>{const c=checks[item.id]||{};const isChecked=c.checked||false;const ts=c.ts||'';
        return `<div class="checklist-item ${isChecked?'checked':''}" data-id="${item.id}">
          <input type="checkbox" id="chk-${item.id}" ${isChecked?'checked':''} />
          ${item._editing?`<div style="flex:1"><input type="text" class="daily-rename-inp" data-id="${item.id}" value="${esc(item.name)}" style="width:100%;margin-bottom:4px" /><input type="url" class="daily-link-inp" data-id="${item.id}" value="${esc(item.url||'')}" placeholder="Link URL (optional)..." style="width:100%;margin-bottom:4px;font-size:12px" /><input type="text" class="daily-note-inp" data-id="${item.id}" value="${esc(item.note||'')}" placeholder="Note (optional)..." style="width:100%;font-size:12px" /></div><div style="display:flex;flex-direction:column;gap:4px;margin-left:6px"><button class="save-btn daily-rename-save" data-id="${item.id}" style="padding:4px 8px">Save</button><button class="save-btn daily-del" data-id="${item.id}" style="color:var(--red);padding:4px 8px">Del</button></div>`
          :`<div style="flex:1"><label for="chk-${item.id}" style="display:block">${esc(item.name)}</label>${item.note?`<div style="font-size:11px;color:var(--text3)">${esc(item.note)}</div>`:''}</div>${isChecked&&ts?`<span style="font-size:11px;color:var(--text3);flex-shrink:0">${ts}</span>`:''} ${item.url?`<a href="${esc(item.url)}" target="_blank" style="font-size:14px;color:var(--blue);text-decoration:none" onclick="event.stopPropagation()">&#128279;</a>`:''}<button class="save-btn daily-edit-btn" data-id="${item.id}" style="padding:2px 6px;font-size:11px;color:var(--text3);background:none;border:0.5px solid var(--border2);margin-left:4px">&#9998;</button>`}
        </div>`;}).join('')}
      <div class="add-row"><input type="text" placeholder="+ Add checklist item…" class="add-daily-input" /></div>
    </div>
  `;
  container.appendChild(dailyEl);
  dailyEl.querySelector('.block-header').addEventListener('click',()=>{app.ongoing._open_daily=!app.ongoing._open_daily;save(app);renderOngoing();});
  dailyEl.querySelectorAll('.checklist-item input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener('change',()=>{setDailyCheck(dayKey,cb.closest('.checklist-item').dataset.id,cb.checked);renderOngoing();});
  });
  dailyEl.querySelectorAll('.daily-edit-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();const item=daily.find(i=>i.id===btn.dataset.id);if(item){item._editing=true;save(app);renderOngoing();}});
  });
  dailyEl.querySelectorAll('.daily-rename-save').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const item=daily.find(i=>i.id===btn.dataset.id);if(!item)return;
      const inp=dailyEl.querySelector('.daily-rename-inp[data-id="'+btn.dataset.id+'"]');if(inp)item.name=inp.value.trim();
      const lnk=dailyEl.querySelector('.daily-link-inp[data-id="'+btn.dataset.id+'"]');if(lnk)item.url=lnk.value.trim();
      const note=dailyEl.querySelector('.daily-note-inp[data-id="'+btn.dataset.id+'"]');if(note)item.note=note.value.trim();
      item._editing=false;save(app);renderOngoing();
    });
  });
  dailyEl.querySelectorAll('.daily-del').forEach(btn=>{
    btn.addEventListener('click',()=>{if(!confirm('Delete this item?'))return;app.ongoing.daily=daily.filter(i=>i.id!==btn.dataset.id);save(app);renderOngoing();});
  });
  // Reset all daily checks
  const resetBtn=document.createElement('button');resetBtn.className='edit-btn';resetBtn.style.cssText='width:100%;margin-top:8px;padding:6px;text-align:center';resetBtn.textContent='↺ Reset all';
  resetBtn.addEventListener('click',()=>{if(!confirm('Reset all daily checks?'))return;app.dailyChecks[dayKey]={};save(app);renderOngoing();});
  dailyEl.querySelector('.block-body').appendChild(resetBtn);
  dailyEl.querySelectorAll('.add-daily-input').forEach(inp=>{
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&inp.value.trim()){
        if(!app.ongoing.daily)app.ongoing.daily=[];
        app.ongoing.daily.push({id:'d-'+Date.now(),name:inp.value.trim()});
        app.ongoing._open_daily=true;save(app);renderOngoing();
      }
    });
  });

  const sections=[
    {key:'weekly',label:'Weekly tasks',icon:'&#128260;'},
    {key:'monthly',label:'Monthly tasks',icon:'&#128197;'},
    {key:'other',label:'Other recurring',icon:'&#128344;'}
  ];
  sections.forEach(sec=>{
    const tasks=[...app.ongoing[sec.key]].sort((a,b)=>a.name.localeCompare(b.name));
    const isOpen=app.ongoing['_open_'+sec.key]||false;
    const today=new Date();today.setHours(0,0,0,0);
    const overdueCount=tasks.filter(t=>t.nextDue&&new Date(t.nextDue+'T00:00:00')<today).length;
    const words=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
    const overdueHtml=overdueCount>0?` <span style="font-size:12px;color:var(--red);font-weight:400">${(overdueCount<=10?words[overdueCount]:overdueCount).charAt(0).toUpperCase()+(overdueCount<=10?words[overdueCount]:overdueCount).slice(1)} past due</span>`:'';
    const el=document.createElement('div');el.className='block';
    el.innerHTML=`
      <div class="block-header">
        <span class="block-title">${sec.icon} ${sec.label} <span class="block-meta">${tasks.length}</span>${overdueHtml}</span>
        <span class="chevron ${isOpen?'open':''}">&#8964;</span>
      </div>
      <div class="block-body ${isOpen?'open':''}">
        ${tasks.map(t=>renderTaskRow(t)).join('')}
        <div class="add-row"><input type="text" placeholder="+ Add task…" data-sec="${sec.key}" class="add-task-input" /></div>
      </div>
    `;
    container.appendChild(el);
    el.querySelector('.block-header').addEventListener('click',()=>{app.ongoing['_open_'+sec.key]=!app.ongoing['_open_'+sec.key];save(app);renderOngoing();});
    el.querySelectorAll('.task-hdr').forEach(h=>{
      h.addEventListener('click',e=>{
        if(e.target.classList.contains('task-link-btn')||e.target.closest('.task-link-btn'))return;
        const t=tasks.find(t=>t.id===h.dataset.t);if(t){t._open=!t._open;save(app);renderOngoing();}
      });
    });
    el.querySelectorAll('.task-save').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const tid=btn.dataset.t;const t=tasks.find(t=>t.id===tid);if(!t)return;
        const nameInp=el.querySelector('.task-rename-inp[data-t="'+tid+'"]');
        const notes=el.querySelector('textarea[data-t="'+tid+'"]');
        const due=el.querySelector('input[data-type="due"][data-t="'+tid+'"]');
        const url=el.querySelector('input[data-type="url"][data-t="'+tid+'"]');
        const extraUrls=el.querySelectorAll('.task-extra-url[data-t="'+tid+'"]');
        if(nameInp&&nameInp.value.trim())t.name=nameInp.value.trim();
        if(notes)t.notes=notes.value;if(due)t.nextDue=due.value;
        if(url){if(t.threadUrl===undefined)t.threadUrl='';t.threadUrl=url.value.trim();}
        const extraLabels=el.querySelectorAll('.task-extra-label[data-t="'+tid+'"]');
        if(extraUrls.length)t.extraUrls=Array.from(extraUrls).map((u,i)=>({label:extraLabels[i]?extraLabels[i].value.trim()||'Link':'Link',url:u.value.trim()})).filter(u=>u.url);
        save(app);flashSaved(btn);renderOngoing();
      });
    });
    // Task rename/delete/extra URLs
    el.querySelectorAll('.task-delete').forEach(btn=>{
      btn.addEventListener('click',()=>{if(!confirm('Delete task?'))return;app.ongoing[sec.key]=tasks.filter(t=>t.id!==btn.dataset.t);save(app);renderOngoing();});
    });
    // task-flag handled by global delegated listener
    el.querySelectorAll('.task-url-add').forEach(btn=>{
      btn.addEventListener('click',()=>{const t=tasks.find(t=>t.id===btn.dataset.t);if(!t)return;if(!t.extraUrls)t.extraUrls=[];t.extraUrls.push({label:'Link',url:''});save(app);renderOngoing();});
    });
    el.querySelectorAll('.task-url-del').forEach(btn=>{
      btn.addEventListener('click',()=>{const t=tasks.find(t=>t.id===btn.dataset.t);if(!t||!t.extraUrls)return;t.extraUrls.splice(parseInt(btn.dataset.ui),1);save(app);renderOngoing();});
    });
    // Task-level link button
    el.querySelectorAll('.task-link-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const t=tasks.find(t=>t.id===btn.dataset.t);if(!t)return;
        if(t.threadUrl&&t.threadUrl.trim()){window.open(t.threadUrl,'_blank');}
        else{t._open=true;save(app);renderOngoing();
          setTimeout(()=>{const inp=el.querySelector('input[data-type="url"][data-t="'+t.id+'"]');if(inp)inp.focus();},50);}
      });
    });
    // Subitem checkboxes
    el.querySelectorAll('.subitem-check').forEach(cb=>{

const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthSortKey(m){const parts=m.id.split('-');if(parts.length===3&&parts[0]==='m')return parseInt(parts[1])*100+parseInt(parts[2]);const lp=m.label.split(' ');if(lp.length===2){const mi=MONTH_NAMES.indexOf(lp[0]);const yi=parseInt(lp[1]);if(mi>=0&&yi)return yi*100+mi;}return 999999;}
function ensureRollingMonths(){
  const now=new Date();
  app.events.months=app.events.months.map(m=>{
    if(!m.id.startsWith('m-')){const lp=m.label.split(' ');if(lp.length===2){const mi=MONTH_NAMES.indexOf(lp[0]);const yi=parseInt(lp[1]);if(mi>=0&&yi)return Object.assign({},m,{id:'m-'+yi+'-'+mi});}return m;}return m;
  });
  const seen=new Map();
  app.events.months.forEach(m=>{const k=monthSortKey(m);if(!seen.has(k)||m.events.length>seen.get(k).events.length)seen.set(k,m);});
  app.events.months=Array.from(seen.values());
  for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);const y=d.getFullYear();const mi=d.getMonth();const id='m-'+y+'-'+mi;if(!app.events.months.find(m=>m.id===id))app.events.months.push({id,label:MONTH_NAMES[mi]+' '+y,events:[]});}
  app.events.months.sort((a,b)=>monthSortKey(a)-monthSortKey(b));
  const cutoff=now.getFullYear()*100+now.getMonth();
  app.events.months=app.events.months.filter(m=>monthSortKey(m)>=cutoff||m.events.length>0);
  save(app);
}

      btn.addEventListener('click',()=>{
        const m=app.events.months.find(m=>m.id===btn.dataset.monthid);

      });

    el.querySelectorAll('.ev-form-add').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const form=el.querySelector('.add-event-form[data-month="'+btn.dataset.month+'"]');
        const dayInp=form.querySelector('.ev-form-day');
        const nameInp=form.querySelector('.ev-form-name');
        const notesInp=form.querySelector('.ev-form-notes');
        const dayNum=parseInt(dayInp.value);
        const endInp=form.querySelector('.ev-form-end');
        const endNum=endInp?parseInt(endInp.value):NaN;
        const name=nameInp.value.trim();
        if(!name||!dayNum)return;
        const sfx=n=>n===1||n===21||n===31?'st':n===2||n===22?'nd':n===3||n===23?'rd':'th';
        const date=isNaN(endNum)||endNum<=dayNum ? dayNum+sfx(dayNum) : dayNum+sfx(dayNum)+'–'+endNum+sfx(endNum);
        const m=app.events.months.find(m=>m.id===btn.dataset.month);
        if(m){
          m.events.push({id:m.id+'-'+Date.now(),date,name,notes:notesInp.value.trim(),location:'',threadUrl:'',_dayNum:dayNum});
          // Sort by day number
          m.events.sort((a,b)=>{
            const an=a._dayNum||parseInt(a.date)||0;
            const bn=b._dayNum||parseInt(b.date)||0;
            return an-bn;
          });
          m._open=true;
          dayInp.value='';nameInp.value='';notesInp.value='';
          form.style.display='none';
          const toggle=el.querySelector('.add-event-toggle[data-month="'+btn.dataset.month+'"]');
          if(toggle)toggle.style.display='block';
          save(app);renderEvents();
        }
      });
    });
  });
}

        +'<button class="edit-btn sup-edit" data-idx="'+idx+'">Edit</button>'

          else{html+='<textarea class="sup-f" data-idx="'+idx+'" data-key="'+f.key+'" style="width:100%;margin-bottom:6px;min-height:50px">'+esc(item[f.key]||'')+'</textarea>';}
        });

        btn.addEventListener('click',function(){

          var i=parseInt(btn.dataset.idx);

          save(app);renderSupport();

      card.querySelectorAll('.sup-dn').forEach(function(btn){

// ── MARY ──────────────────────────────────────────────────────
function renderMary(){
  const container=document.getElementById('tab-mary');container.innerHTML='';

    {key:'high',label:'High priority',items:items.filter(i=>i.priority==='high')},
    {key:'medium',label:'Medium priority',items:items.filter(i=>i.priority==='medium')},

    </div>
    <div class="block-body open">

          const priMed='pri-btn'+(item.priority==='medium'?' selected-medium':'');

            +'<div class="mary-hdr" data-id="'+item.id+'">'

            +'<span class="mary-name '+(item.done?'done':'')+'">'+esc(item.name)+'</span>'
            +'<span class="chevron '+(item._open?'open':'')+'" style="font-size:13px;color:var(--text3)">&#8964;</span>'
            +'</div>'
            +'<div class="mary-body '+(item._open?'open':'')+'">'
            +'<div class="field-label">Note for Mary</div>'
            +'<textarea data-id="'+item.id+'" class="mary-note" placeholder="Add context for Mary…">'+esc(item.note||'')+'</textarea>'
            +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap">'
            +'<div class="priority-picker">'
            +'<button class="'+priHigh+'" data-id="'+item.id+'" data-pri="high">High</button>'
            +'<button class="'+priMed+'" data-id="'+item.id+'" data-pri="medium">Medium</button>'

            +'<div style="display:flex;align-items:center;gap:8px">'

            +'<button class="save-btn mary-delete" data-id="'+item.id+'" style="color:var(--red)">Remove</button>'

        }).join('');

          +'<div style="padding:8px 16px;background:var(--bg2);font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em">'+g.label+'</div>'

      ${items.length===0?'<div class="empty-note" style="padding:14px 16px">Nothing for Mary yet</div>':''}

      if(item){item._open=!item._open;save(app);renderMary();}
    });
  });
  mainEl.querySelectorAll('.mary-check').forEach(cb=>{
    cb.addEventListener('change',e=>{e.stopPropagation();const item=app.mary.items.find(i=>i.id===cb.dataset.id);if(item){item.done=cb.checked;save(app);renderMary();}});

  block.innerHTML=`
    <div class="block-header" style="cursor:default">

    </div>

            <div class="field-label" style="margin-top:8px">Link</div>

      </div>

  `;
